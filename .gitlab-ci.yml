Deploy to Production Server:
  stage: Deploy
  image: alpine:latest
  environment: production
  needs:
    - Pytest and Coverage
    - Bandit
  before_script:
  - 'command -v ssh-agent >/dev/null || ( apk add --update openssh openssl)'
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY_ORC_DEMO" | tr -d '\r' > private.key.enc
  - openssl enc -d -a -A -in private.key.enc -out private.key
  - echo "" >> private.key
  - chmod 400 private.key
  - ssh-add private.key
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - ssh-keyscan $ORC_DEMO_IP_ADDRESS >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts
  script:
  - ssh $SSH_USER@$ORC_DEMO_IP_ADDRESS "cd /orc/OpenResearchConverter; bash .update.sh; docker-compose down; docker-compose up --build -d"
  after_script:
  - rm private.key.enc private.key
  only:
  - dev

generate-badges:
  stage: Build
  image: docker-private.gesis.intra/gesis/dc-python:1.0
  only:
    - main
    - dev
  script:
    - echo "Installing anybadge"
    - /python/venv/bin/python -m pip install anybadge
    - echo "Creating output directory"
    - mkdir ./badges/
    - echo "Generating badges"
    - /python/venv/bin/python generate_badges.py
    - echo "Uploading badges to Gitlab"
  artifacts:
    paths:
      - ./badges/python_version.svg
      - ./badges/pre_commit_version.svg
      - ./badges/poetry_version.svg
      - ./badges/python_runner_image.svg
