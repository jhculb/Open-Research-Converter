variables:
  VERSION: "0.0-Alpha-Dev"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

stages:
  - build
  - lint
  - test
  - deploy

base:
  stage: build
  image: docker-private.gesis.intra/gesis/dc-python:1.0
  script:
    - /python/venv/bin/python -m poetry install --with dev

PyLint:
  stage: lint
  extends: base
  script:
    - /python/venv/bin/python -m pylint ./src

Ensure Pep8:
  stage: lint
  extends: base
  script:
    - /python/venv/bin/python -m flake8 ./

Test:
  stage: test
  extends: base
  script:
    - /python/venv/bin/python -m coverage run -m pytest ./tests
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

Typecheck:
  stage: test
  image: docker-private.gesis.intra/gesis/dc:42-install-npm
  before_script:
    - npm i -g pyright
    - npm i -g pyright-to-gitlab-ci
  script:
   - pyright ./src --outputjson > report_raw.json
   - pyright-to-gitlab-ci --src report_raw.json --output report.json --base_path .
  artifacts:
    paths:
      - report.json
    reports:
      codequality: report.json

# deploy:
#   stage: deploy
#   script: echo "Define your deployment script!"
#   environment: production

publish:
  stage: deploy
  extends: base
  script:
    - echo "This is the build stage"
    - /python/venv/bin/python -m poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - echo "Repository gitlab configured ..."
    - /python/venv/bin/python -m poetry build
    - echo "Build done ..."
    - /python/venv/bin/python -m poetry publish --repository gitlab -u gitlab-ci-token -p ${CI_JOB_TOKEN}
    - echo "Publishing done!"
