
variables:
  VERSION: "0.0-Alpha-Dev"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"


cache:
  paths:
    - .cache/pip
    - venv/

stages:
  - build
  - lint
  - test
  - sonarqube
  - prod
  - deploy

base:
  stage: build
  image: docker-private-snapshots.gesis.intra/gesis/dc:50-extend-base-image-for-python-usage
  script:
    - echo "This is the base stage - to configure and install other files not contained in the pyproject.toml do so here"

pylint:
  stage: lint
  extends: base
  needs: 
    - base
  script:
    - /python/venv/bin/python -m pylint ./src

ensure-pep8:
  stage: lint
  extends: base
  needs: 
    - base
  script:
    - /python/venv/bin/python -m flake8 ./ 

pytest-and-coverage:
  stage: test
  extends: base
  needs: 
    - pylint
    - ensure-pep8
  script:
    - pwd
    - /python/venv/bin/python -m coverage run -m pytest ./tests
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

typecheck:
  stage: test
  needs:
    - pylint
    - ensure-pep8
  image: docker-private.gesis.intra/gesis/dc:42-install-npm
  before_script:
    - npm i -g pyright
    - npm i -g pyright-to-gitlab-ci
  script:
   - pyright ./src --outputjson > report_raw.json
   - pyright-to-gitlab-ci --src report_raw.json --output report.json --base_path .
  artifacts:
    paths:
      - report.json
    reports:
      codequality: report.json

sonarqube:
  stage: sonarqube
  needs:
   - base
  extends: base
  script: echo "todo - configure sonarqube deployment!"

deploy-to-test-server:
  stage: deploy
  extends: base
  when: manual
  script: echo "Use this to deploy your project to a test server"

deploy-to-prod-server:
  stage: deploy
  needs:
    - sonarqube
    - pytest-and-coverage
    - typecheck
  script: echo "Define your deployment script!"
  environment: production
  when: manual

publish-to-local-pypi:
  stage: deploy
  needs:
    - sonarqube
    - pytest-and-coverage
    - typecheck
  script: echo "Define your deployment script!"
  environment: production
  when: manual

