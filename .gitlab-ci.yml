variables:
  VERSION: "0.1-Beta-Dev"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

stages:
  - Build
  - Lint
  - Test
  - Sonarqube
  - Deploy
  - Badges

Base:
  stage: Build
  image: docker-private.gesis.intra/gesis/dc-python:1-migrate-to-ruff
  script:
    - echo "Installing package on base image, including development packages"
    - /python/venv/bin/python -m poetry install --with dev
    - source /builds/omino/OpenResearchConverter/.venv/bin/activate

Lint:
  stage: Lint
  extends: Base
  needs:
    - Base
  script:
    - echo "Running Ruff's Linter"
    - /python/venv/bin/python -m ruff check ./src

Pytest and Coverage:
  stage: Test
  extends: Base
  needs:
    - Lint
  script:
    - echo "Running Coverage with Pytest"
    - /python/venv/bin/python -m poetry install --with dev
    - /python/venv/bin/python -m poetry run coverage run -m pytest ./tests
    - echo "Uploading Coverage report to Gitlab"
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

Bandit:
  stage: Test
  extends: Base
  needs:
    - Lint
  script:
    - echo "Running Bandit"
    - /python/venv/bin/python -m bandit -c pyproject.toml -r ./src/ --format txt > bandit.txt
    - echo "Uploading Coverage report to Gitlab"
  artifacts:
    paths:
      - bandit.txt
    reports:
      sast: bandit.txt

