variables:
  VERSION: "0.0-Alpha-Dev"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

stages:
  - Build
  - Lint
  - Test
  - Sonarqube
  - Deploy

Base:
  stage: Build
  image: docker-private.gesis.intra/gesis/dc-python:1.0
  script:
    - /python/venv/bin/python -m poetry install --with dev

Pylint:
  stage: Lint
  extends: Base
  needs:
    - Base
  script:
    - /python/venv/bin/python -m pylint ./src

Ensure Pep8:
  stage: Lint
  extends: Base
  needs:
    - Base
  script:
    - /python/venv/bin/python -m flake8 ./

Pytest and Coverage:
  stage: Test
  extends: Base
  needs:
    - Pylint
    - Ensure Pep8
  script:
    - /python/venv/bin/python -m coverage run -m pytest ./tests
  coverage: '/TOTAL.*\s+(\d+\%)/'
  artifacts:
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

Typecheck:
  stage: Test
  needs:
    - Pylint
    - Ensure Pep8
  image: docker-private.gesis.intra/gesis/dc:42-install-npm
  before_script:
    - npm i -g pyright
    - npm i -g pyright-to-gitlab-ci
  script:
   - pyright ./src --outputjson > report_raw.json
   - pyright-to-gitlab-ci --src report_raw.json --output report.json --base_path .
  artifacts:
    paths:
      - report.json
    reports:
      codequality: report.json

Sonarqube:
  stage: Sonarqube
  needs:
   - Base
  extends: Base
  script: echo "todo - configure sonarqube deployment!"

deploy-to-test-server:
  stage: Deploy
  extends: Base
  when: manual
  script: echo "Use this to deploy your project to a test server"

deploy-to-prod-server:
  stage: Deploy
  needs:
    - Sonarqube
    - Pytest and Coverage
    - Typecheck
  environment: production
  when: manual
  script: echo "Define your deployment script!"

publish-to-local-pypi:
  stage: Deploy
  needs:
    - Sonarqube
    - Pytest and Coverage
    - Typecheck
  environment: production
  when: manual
  script: echo "Define your deployment script!"

publish:
  stage: Deploy
  extends: Base
  when: manual
  script:
    - echo "This is the publishing stage"
    - /python/venv/bin/python -m poetry config repositories.gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    - echo "Repository gitlab configured ..."
    - /python/venv/bin/python -m poetry build
    - echo "Build done ..."
    - /python/venv/bin/python -m poetry publish --repository gitlab -u gitlab-ci-token -p ${CI_JOB_TOKEN}
    - echo "Publishing done!"
