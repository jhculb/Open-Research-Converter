version: '3.3'

services:
  nginx:
    container_name: reverse-proxy
    hostname: reverse
    image: nginx:latest
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_data:/etc/nginx
      - nginx_data:/etc/ssl/private
    restart: always
    networks:
      - frontend

  frontend:
    container_name: frontend
    build:
      context: ./
      dockerfile: ./src/orc/frontend/Dockerfile
      environment: ./src/environment/frontend/frontend.env
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend
      - backend

  backend:
    container_name: orc-backend
    build:
      context: ./
      dockerfile: ./src/orc/backend/Dockerfile
      environment: ./src/environment/backend/backend.env
    ports:
      - "80:80"
      - "443:443"
    restart: always
    networks:
      - backend

volumes:
    nginx_data: {}

networks:
  frontend:
  backend: