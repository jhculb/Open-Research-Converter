services:
  nginx:
    container_name: reverse-proxy
    hostname: reverse
    build:
      context: ./src/orc/nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./logs/nginx/:/var/log/nginx/:rw
      - ./src/orc/nginx/certbot/www/:/var/www/certbot/:ro
      - ./src/orc/nginx/certbot/conf/:/etc/nginx/ssl/:ro
    environment:
      - TZ=Europe/Berlin
    env_file:
      - ./src/env/nginx.env

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./src/orc/nginx/certbot/www/:/var/www/certbot/:rw
      - ./src/orc/nginx/certbot/conf/:/etc/letsencrypt/:rw

  frontend:
    container_name: orc-frontend
    hostname: frontend
    build:
      context: ./src/orc/frontend/
      # volumes:
      # - ./logs/frontend:/var/log/nginx
    environment:
      - TZ=Europe/Berlin
    restart: always

  backend:
    container_name: orc-backend
    hostname: backend
    build:
      context: ./
      dockerfile: ./src/orc/backend/Dockerfile
    volumes:
      - ./logs/backend:/app/logs:rw
    environment:
      - TZ=Europe/Berlin
    restart: always
    env_file:
      - ./src/env/backend.env
