services:
  nginx:
    container_name: reverse-proxy
    hostname: reverse
    env_file:
      - ./src/env/nginx.env
    build:
      context: ./src/orc/nginx
      args:
        - NGINX_CONF=$LOCAL_OR_PRODUCTION
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    restart: always
    volumes:
      - ./logs/nginx/:/var/log/nginx/:rw
      - ./src/orc/nginx/certbot/www/:/var/www/certbot/:ro
      - ./src/orc/nginx/certbot/conf/:/etc/nginx/ssl/:ro
    networks:
      - orc-network
      - certbot-network
    labels:
      - diun.enable=true

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./src/orc/nginx/certbot/www/:/var/www/certbot/:rw
      - ./src/orc/nginx/certbot/conf/:/etc/letsencrypt/:rw
      - ./logs/certbot/:/var/log/letsencrypt/:rw
    networks:
      - certbot-network

  frontend:
    container_name: orc-frontend
    hostname: frontend
    build:
      context: ./src/orc/frontend/
    volumes:
      - ./logs/frontend/:/var/log/:rw
      - ./src/env/js.env:/orc-demo/.env:ro
    restart: always
    env_file:
      - ./src/env/frontend.env
    networks:
      - orc-network
    labels:
      - diun.enable=true

  backend:
    container_name: orc-backend
    hostname: backend
    build:
      context: ./
      dockerfile: ./src/orc/backend/Dockerfile
      args:
        - POETRY_VERSION=1.8.3
    volumes:
      - ./logs/backend:/app/logs:rw
    restart: always
    env_file:
      - ./src/env/backend.env
    networks:
      - orc-network
    labels:
      - diun.enable=true

  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    volumes:
      - "./diun/data/:/data:rw"
      - "./diun/diun.yml:/etc/diun/diun.yml:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    environment:
      - "TZ=Europe/Berlin"
      - "LOG_LEVEL=debug"
      - "LOG_JSON=false"
    labels:
      - diun.enable=true
    networks:
      - orc-network
    restart: always
    healthcheck:
      test: ["CMD", "diun",  "healthcheck"]
      interval: 1h
      timeout: 30s
      retries: 5

networks:
  orc-network:
    driver: bridge
  certbot-network:
    driver: bridge
